[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppq-hermes-provider"
version = "0.1.0"
description = "Hermes model provider plugin for PayPerQ"
requires-python = ">=3.10"

[project.entry-points."hermes.plugins"]
ppq = "ppq_hermes_provider:register_provider"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests, no network required",
    "integration: require PPQ_API_KEY and live API",
]
